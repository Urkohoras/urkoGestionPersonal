<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png"> 
    <title>Tareas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="menu-desplegable">
            <button class="boton-menu" id="btn-menu">☰</button>
            <div class="contenido-menu" id="contenido-menu">
                <a href="index.html">Inicio</a>
                <a href="tareas.html">Tareas</a>
                <a href="peliculas.html">Películas</a>
                <a href="musica.html">Música</a>
            </div>
        </nav>

        <h1>Mis Tareas</h1>
    </header>

    <main>
        <section id="tareas">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin-bottom: 0; border: none; padding: 0;">Lista de Tareas</h2>
                <div style="display: flex; gap: 10px;">
                    <button id="btn-ver-completadas" class="btn-secundario">Ver Completadas</button>
                    <button id="btn-abrir-formulario" class="btn-principal"> + Añadir Tarea</button>
                </div>
            </div>
            
            <ul id="lista-tareas">
                <!-- Tareas pendientes -->
            </ul>

            <!-- Nuevo contenedor para tareas completadas -->
            <div id="contenedor-completadas" class="oculto" style="margin-top: 30px; border-top: 1px solid #2c323d; padding-top: 20px;">
                <h3 style="color: #94a3b8; font-size: 1.1rem; margin-bottom: 15px; text-align: left;">Tareas Completadas</h3>
                <ul id="lista-tareas-completadas" style="margin-top: 0;">
                    <!-- Tareas completadas -->
                </ul>
            </div>
        </section>
    </main>

    <div id="modal-tarea" class="modal-oculto">
        <div class="contenido-modal">
            <h3>Nueva Tarea</h3>
            
            <div class="grupo-formulario">
                <label for="nombre-tarea">Nombre de la tarea *</label>
                <input type="text" id="nombre-tarea" placeholder="Ej: Estudiar para Física">
            </div>
            
            <div class="grupo-formulario">
                <label for="tipo-tarea">Tipo de tarea</label>
                <select id="tipo-tarea">
                    <option value="Deberes">Deberes</option>
                    <option value="Examen">Examen</option>
                    <option value="Trabajo">Trabajo</option>
                    <option value="Personal">Personal</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
            
            <div class="grupo-formulario">
                <label for="fecha-tarea">Fecha de fin (Opcional)</label>
                <input type="date" id="fecha-tarea">
            </div>
            
            <div class="grupo-formulario">
                <label for="ref-tarea">Asignatura / Referencia (Opcional)</label>
                <input type="text" id="ref-tarea" placeholder="Ej: Física II / Gimnasio">
            </div>
            
            <div class="acciones-modal">
                <button id="btn-cancelar-tarea" class="btn-secundario">Cancelar</button>
                <button id="btn-guardar-tarea" class="btn-principal">Guardar</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
