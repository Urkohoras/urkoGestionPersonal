<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Gestor Personal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mi Espacio Personal</h1>
        <p>Tareas, películas, libros y más.</p>
    </header>

    <main>
        <section id="tareas">
            <h2>Mis Tareas</h2>
            <input type="text" id="nueva-tarea" placeholder="Escribe una nueva tarea...">
            <button id="btn-agregar-tarea">Añadir</button>
            <ul id="lista-tareas">
                <li>Ejemplo: Configurar GitHub Pages</li>
            </ul>
        </section>

        <section id="entretenimiento">
            <h2>Entretenimiento</h2>
            <div class="categoria">
                <h3>Películas Vistas</h3>
                <ul id="lista-peliculas">
                    <li>Ejemplo: El Padrino</li>
                </ul>
            </div>
            </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
