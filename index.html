<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/png" href="favicon.png"> 
    
    <title>Inicio - Mi Gestor Personal</title> 
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="menu-desplegable">
            <button class="boton-menu" id="btn-menu">☰</button>
            <div class="contenido-menu" id="contenido-menu">
                <a href="index.html">Inicio</a>
                <a href="tareas.html">Tareas</a>
                <a href="peliculas.html">Películas</a>
                <a href="musica.html">Música</a>
            </div>
        </nav>

        <h1>Mi Gestor Personal</h1>
    </header>

    <main>
        <section id="seccion-calendario">
            <div class="calendario-header">
                <button id="mes-anterior">◀</button>
                <h2 id="mes-anio"></h2>
                <button id="mes-siguiente">▶</button>
            </div>
            <div class="dias-semana">
                <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
            </div>
            <div id="dias-calendario" class="dias-calendario">
                </div>
        </section>
    </main>

    <div id="modal-detalle-dia" class="modal-oculto">
        <div class="contenido-modal modal-dia-completo">
            
            <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2c323d; padding-bottom: 15px; margin-bottom: 15px;">
                <h3 id="titulo-detalle-dia" style="margin: 0; border: none; padding: 0;">Detalle del Día</h3>
                <button id="btn-cerrar-detalle-dia" class="boton-cerrar-simple" style="font-size: 1.4rem; padding-bottom: 2px;">✖</button>
            </div>
            
            <div class="contenedor-columnas-dia">
                <!-- INICIO COLUMNA TAREAS (CORREGIDA) -->
                <div class="columna-detalle-dia">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2c323d; padding-bottom: 8px; margin-bottom: 10px;">
                        <h4 style="border: none; padding: 0; margin: 0;">Tareas del Día</h4>
                        <button id="btn-abrir-form-tarea-calendario" class="btn-secundario" style="padding: 4px 10px; font-size: 0.85rem;">+ Añadir tarea</button>
                    </div>
                    <ul id="lista-tareas-dia" class="lista-tareas-calendario" style="margin-top: 5px;">
                    </ul>
                </div>
                
                <div class="columna-detalle-dia">
                    <h4 style="margin-bottom: 10px;">Organización del Día</h4>
                    
                    <ul id="lista-organizacion-dia">
                        </ul>
                    
                    <div class="form-organizar-dia">
                        <div class="fila-horas">
                            <input type="time" id="hora-inicio-actividad">
                            <input type="time" id="hora-fin-actividad">
                        </div>
                        <div class="fila-titulo">
                            <input type="text" id="titulo-actividad" placeholder="Ej: Estudiar">
                            <button id="btn-add-actividad" class="btn-secundario">+</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-tarea" class="modal-oculto">
        <div class="contenido-modal">
            <h3>Nueva Tarea</h3>
            
            <div class="grupo-formulario">
                <label for="nombre-tarea">Nombre de la tarea *</label>
                <input type="text" id="nombre-tarea" placeholder="Ej: Estudiar para Física">
            </div>
            
            <div class="grupo-formulario">
                <label for="tipo-tarea">Tipo de tarea</label>
                <select id="tipo-tarea">
                    <option value="Deberes">Deberes</option>
                    <option value="Examen">Examen</option>
                    <option value="Trabajo">Trabajo</option>
                    <option value="Personal">Personal</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
            
            <div class="grupo-formulario">
                <label for="fecha-tarea">Fecha de fin (Opcional)</label>
                <input type="date" id="fecha-tarea">
            </div>
            
            <div class="grupo-formulario">
                <label for="ref-tarea">Asignatura / Referencia (Opcional)</label>
                <input type="text" id="ref-tarea" placeholder="Ej: Física II / Gimnasio">
            </div>
            
            <div class="acciones-modal">
                <button id="btn-cancelar-tarea" class="btn-secundario">Cancelar</button>
                <button id="btn-guardar-tarea" class="btn-principal">Guardar</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
